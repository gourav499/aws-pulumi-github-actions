
name: Pulumi Preview Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev-preview:
    name: Validate AWS and Pulumi Backend
    runs-on: ubuntu-latest

    env:
      PULUMI_BACKEND_URL: s3://pulumi-state-683541454005-multienv-2026
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulumi/hjinfotech-infrastructure/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        working-directory: pulumi/hjinfotech-infrastructure
        run: npm ci

      - name: Validate Pulumi passphrase
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        shell: bash
        run: |
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::Passphrase secret is missing or empty"
            exit 1
          fi

          if [ "$PULUMI_CONFIG_PASSPHRASE" = "ss22" ]; then
            echo "Passphrase matches the locally confirmed value"
          else
            echo "::error::Passphrase differs from the locally confirmed value"
            exit 1
          fi

      - name: Preview Dev stack only
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        with:
          command: preview
          stack-name: dev-app1
          work-dir: pulumi/hjinfotech-infrastructure
          cloud-url: s3://pulumi-state-683541454005-multienv-2026
